name: Build Artifacts

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Si no hay secreto, se usa una contraseña de prueba para un keystore temporal
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD_SECRET || 'mx-test-ci-pass' }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.12
          cache-read-only: false
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
      - name: Set env
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          git config --global user.email "ci@noreply.example.com"
          git config --global user.name "github_actions"
          echo "RELEASE_TAG=prerelease-$(date +'%Y.%m.%d').B${GITHUB_RUN_NUMBER}" | tee -a $GITHUB_ENV
          echo "RELEASE_VERSION=$(date +'%Y.%m.%d').B${GITHUB_RUN_NUMBER}" | tee -a $GITHUB_ENV
          
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | openssl enc -d -base64 -in - -out bekeystore.jks
          else
            echo "KEYSTORE_BASE64 no definido: generando keystore temporal de prueba"
            keytool -genkeypair -alias MindustryX -keyalg RSA -keysize 2048 -validity 10000 \
              -storetype PKCS12 -keystore bekeystore.jks \
              -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=MindustryX CI Test"
          fi
      - name: Build
        env:
          keystore_password: ${{ env.KS_PASS }}
          keystore_alias_password: ${{ env.KS_PASS }}
          keystore_alias: MindustryX
        run: |
          git submodule update --init --depth=10
          ./scripts/applyPatches.sh
          cd work
          gradle -Pbuildversion=${RELEASE_VERSION} --parallel \
            desktop:dist desktop:distSdl3 server:dist core:genLoaderModAll android:assembleRelease 
          
          cd ..
          mkdir artifacts
          mv work/desktop/build/libs/Mindustry.jar artifacts/MindustryX-${{env.RELEASE_VERSION}}-Desktop.jar
          mv work/desktop/build/libs/Mindustry-SDL3.jar artifacts/MindustryX-${{env.RELEASE_VERSION}}-Desktop-SDL3.jar
          mv work/server/build/libs/server-release.jar artifacts/server-${{env.RELEASE_VERSION}}.jar
          mv work/core/build/distributions/MindustryX.loader.dex.jar artifacts/dexed-MindustryX-${{env.RELEASE_VERSION}}.loader.jar
          mv work/android/build/outputs/apk/release/android-release.apk artifacts/MindustryX-${{env.RELEASE_VERSION}}-Android.apk
#      - name: Update Tag
#        uses: rickstaa/action-create-tag@v1
#        with:
#          tag: ${{ env.RELEASE_TAG }}
#          force_push_tag: true
      - name: Release
        uses: softprops/action-gh-release@v2.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{github.sha}}
          files: artifacts/*
          prerelease: true
      - uses: oven-sh/setup-bun@v1
      - name: clearOldAssets
        run: bun run .github/actions/clearOldAssets.ts
        env:
          TOKEN: ${{secrets.GITHUB_TOKEN}}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
